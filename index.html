<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complicité</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #070709;
  --surface:  #0f0f14;
  --surface2: #17171f;
  --surface3: #1e1e28;
  --border:   rgba(255,255,255,0.06);
  --border2:  rgba(255,255,255,0.12);
  --neon-pink:  #ff2d78;
  --neon-cyan:  #00f5d4;
  --neon-yellow:#f9e000;
  --neon-purple:#b44fff;
  --text:     #f2f0f8;
  --muted:    rgba(242,240,248,0.45);
  --muted2:   rgba(242,240,248,0.2);
  --r:        10px;
  --r-lg:     18px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Space Mono', monospace;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── SCANLINES ── */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.08) 2px,
    rgba(0,0,0,0.08) 4px
  );
}

/* ── GRID BG ── */
body::after {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(0,245,212,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,245,212,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
}

.app {
  position: relative; z-index: 1;
  max-width: 600px; margin: 0 auto;
  padding: 2rem 1.25rem 5rem;
  min-height: 100vh;
}

/* ── SCREENS ── */
.screen { display: none; }
.screen.active { display: block; animation: fadeIn .3s ease both; }
@keyframes fadeIn { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform:none; } }

/* ── LOGO ── */
.logo-wrap {
  display: flex; align-items: center; gap: 14px;
  margin-bottom: 2.5rem;
}
.logo-icon {
  font-size: 26px;
  width: 46px; height: 46px;
  display: flex; align-items: center; justify-content: center;
  border: 2px solid var(--neon-cyan);
  border-radius: 10px;
  box-shadow: 0 0 12px rgba(0,245,212,0.3), inset 0 0 12px rgba(0,245,212,0.06);
}
.logo-text {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 15px;
  letter-spacing: .25em;
  text-transform: uppercase;
  color: var(--neon-cyan);
  text-shadow: 0 0 8px rgba(0,245,212,0.5);
}

/* ── HEADINGS ── */
h1 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(52px, 13vw, 80px);
  line-height: .95;
  letter-spacing: .02em;
  color: var(--text);
  margin-bottom: .5rem;
}
h1 .accent-pink  { color: var(--neon-pink);  text-shadow: 0 0 20px rgba(255,45,120,.5); }
h1 .accent-cyan  { color: var(--neon-cyan);  text-shadow: 0 0 20px rgba(0,245,212,.5); }
h2 {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700; font-size: 22px;
  letter-spacing: .05em; text-transform: uppercase;
  color: var(--text);
}
p { font-size: 13px; color: var(--muted); line-height: 1.7; }
.section-label {
  font-family: 'Space Mono', monospace;
  font-size: 10px; letter-spacing: .15em; text-transform: uppercase;
  color: var(--neon-cyan); margin-bottom: .625rem;
  opacity: .7;
}

/* ── INPUTS ── */
input[type=text] {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: var(--r);
  padding: .8rem 1rem;
  font-size: 14px;
  font-family: 'Space Mono', monospace;
  color: var(--text);
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}
input[type=text]:focus {
  border-color: var(--neon-cyan);
  box-shadow: 0 0 0 3px rgba(0,245,212,.1), 0 0 12px rgba(0,245,212,.15);
}
input[type=text]::placeholder { color: var(--muted2); }

/* ── BUTTONS ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: .8rem 1.25rem;
  border-radius: var(--r);
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 16px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  cursor: pointer; border: none;
  transition: all .15s;
  position: relative; overflow: hidden;
}
.btn::after {
  content: '';
  position: absolute; inset: 0;
  background: rgba(255,255,255,0);
  transition: background .15s;
}
.btn:hover::after { background: rgba(255,255,255,0.06); }
.btn:active { transform: scale(.97); }

.btn-primary {
  background: var(--neon-pink);
  color: #fff;
  width: 100%;
  box-shadow: 0 0 20px rgba(255,45,120,.35), 0 4px 16px rgba(255,45,120,.2);
  text-shadow: 0 1px 4px rgba(0,0,0,.3);
}
.btn-primary:hover {
  box-shadow: 0 0 30px rgba(255,45,120,.55), 0 6px 24px rgba(255,45,120,.3);
  transform: translateY(-1px);
}

.btn-add {
  background: var(--surface3);
  color: var(--neon-cyan);
  border: 1px solid rgba(0,245,212,.3);
  white-space: nowrap;
  box-shadow: 0 0 8px rgba(0,245,212,.1);
}
.btn-add:hover {
  border-color: var(--neon-cyan);
  box-shadow: 0 0 16px rgba(0,245,212,.25);
}

.btn-ghost {
  background: transparent;
  color: var(--muted);
  border: 1px solid var(--border2);
  flex: 1;
}
.btn-ghost:hover { color: var(--text); border-color: rgba(255,255,255,.25); }

/* ── CARDS ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: .875rem 1.125rem;
  margin-bottom: .5rem;
  transition: border-color .2s;
}
.card:hover { border-color: var(--border2); }

.divider { height: 1px; background: var(--border); margin: 1.5rem 0; }
.error-msg { font-size: 12px; color: var(--neon-pink); margin: .5rem 0; display: none; font-family: 'Space Mono', monospace; }
.btn-row { display: flex; gap: 8px; }

/* ── SCORES ── */
.scores-wrap {
  display: flex; gap: 6px; margin-bottom: 1.25rem; flex-wrap: wrap;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: .75rem;
}
.score-chip {
  flex: 1; min-width: 70px; text-align: center;
  padding: .5rem .5rem .4rem; border-radius: 8px;
  transition: all .2s;
}
.score-chip.active {
  background: rgba(255,45,120,.1);
  border: 1px solid rgba(255,45,120,.35);
}
.score-chip .num {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 30px; color: var(--muted2);
  line-height: 1; transition: all .2s;
}
.score-chip.active .num {
  color: var(--neon-pink);
  text-shadow: 0 0 12px rgba(255,45,120,.6);
}
.score-chip .lbl {
  font-size: 10px; color: var(--muted2); margin-top: 2px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90px; margin: 2px auto 0;
}
.score-chip.active .lbl { color: rgba(255,45,120,.6); }

/* ── TURN PILL ── */
.turn-pill {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--surface2); border: 1px solid var(--border2);
  border-radius: 100px; padding: .4rem 1rem;
  font-size: 12px; color: var(--muted);
  font-family: 'Space Mono', monospace;
  margin-bottom: 1.25rem;
}
.turn-pill strong { color: var(--neon-cyan); font-weight: 400; }
.blink {
  width: 6px; height: 6px; background: var(--neon-pink); border-radius: 50%;
  box-shadow: 0 0 6px var(--neon-pink);
  animation: blink-anim 1s ease-in-out infinite;
}
@keyframes blink-anim { 0%,100%{opacity:1} 50%{opacity:.2} }

/* ── WORD STAGE ── */
.word-stage {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 22px;
  padding: 3rem 1.5rem 2.5rem;
  text-align: center;
  margin: 0 0 1.25rem;
  position: relative; overflow: hidden;
}
/* corner decorations */
.word-stage::before, .word-stage::after {
  content: '';
  position: absolute;
  width: 60px; height: 60px;
  border-color: rgba(0,245,212,.15);
  border-style: solid;
}
.word-stage::before {
  top: 12px; left: 12px;
  border-width: 2px 0 0 2px;
  border-radius: 6px 0 0 0;
}
.word-stage::after {
  bottom: 12px; right: 12px;
  border-width: 0 2px 2px 0;
  border-radius: 0 0 6px 0;
}

.word-num {
  font-size: 10px; letter-spacing: .2em; text-transform: uppercase;
  color: var(--muted2); margin-bottom: 1.25rem;
  font-family: 'Space Mono', monospace;
}
.word-main {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(36px, 9vw, 56px);
  color: var(--text); line-height: 1.05;
  margin-bottom: 1rem;
  animation: wordIn .35s cubic-bezier(.175,.885,.32,1.275) both;
}
@keyframes wordIn {
  from { opacity:0; transform: scale(.85) translateY(8px); }
  to   { opacity:1; transform: none; }
}

.cat-badge {
  display: inline-flex; align-items: center; gap: 5px;
  background: rgba(0,245,212,.08);
  border: 1px solid rgba(0,245,212,.2);
  border-radius: 100px; padding: .3rem .875rem;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
  color: var(--neon-cyan);
}
.cat-badge::before {
  content: '▶';
  font-size: 8px; opacity: .6;
}

/* ── BUZZ GRID ── */
.buzz-label {
  font-size: 10px; letter-spacing: .15em; text-transform: uppercase;
  color: var(--muted2); margin-bottom: .625rem;
  font-family: 'Space Mono', monospace;
}
.buzz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
  gap: 8px; margin-bottom: .75rem;
}
.buzz-btn {
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 14px;
  padding: 1rem .75rem;
  cursor: pointer; text-align: center;
  font-family: 'Barlow Condensed', sans-serif;
  transition: all .15s;
  position: relative; overflow: hidden;
}
.buzz-btn::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,45,120,0), rgba(255,45,120,0));
  transition: background .2s;
}
.buzz-btn:hover {
  border-color: rgba(255,45,120,.5);
  transform: translateY(-2px);
  box-shadow: 0 4px 16px rgba(255,45,120,.15), 0 0 12px rgba(255,45,120,.1);
}
.buzz-btn:hover::before { background: linear-gradient(135deg, rgba(255,45,120,.06), transparent); }
.buzz-btn:active { transform: scale(.97); }
.buzz-btn.is-active {
  background: rgba(249,224,0,.07);
  border-color: rgba(249,224,0,.4);
  box-shadow: 0 0 16px rgba(249,224,0,.12);
}
.buzz-btn.is-active:hover {
  border-color: var(--neon-yellow);
  box-shadow: 0 4px 16px rgba(249,224,0,.2), 0 0 16px rgba(249,224,0,.15);
}
.buzz-btn .bname {
  font-size: 15px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  color: var(--text); display: block; margin-bottom: 3px;
}
.buzz-btn.is-active .bname { color: var(--neon-yellow); text-shadow: 0 0 8px rgba(249,224,0,.4); }
.buzz-btn .bplayers {
  font-size: 11px; color: var(--muted); font-family: 'Space Mono', monospace; font-weight: 400;
}
.buzz-btn.is-active .bplayers { color: rgba(249,224,0,.5); }

/* ── RESULT ── */
.result-card {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: var(--r-lg);
  padding: 2rem 1.5rem;
  text-align: center;
  margin: .5rem 0 1.25rem;
  animation: fadeIn .25s ease both;
}
.result-emoji { font-size: 48px; display: block; margin-bottom: .75rem; }
.result-msg { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 600; color: var(--text); letter-spacing: .04em; }
.result-word {
  margin-top: .75rem;
  font-size: 11px; color: var(--muted2); font-family: 'Space Mono', monospace;
}
.result-word span { color: var(--neon-cyan); }

/* ── SETUP TEAM CARD ── */
.team-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: .75rem 1rem;
  margin-bottom: .5rem;
  display: flex; align-items: center; gap: 10px;
  transition: border-color .2s;
}
.team-card:hover { border-color: var(--border2); }
.team-num {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px; color: var(--neon-pink); opacity: .5;
  min-width: 28px; text-align: center;
}
.team-name { font-size: 14px; font-weight: 400; flex: 1; }
.team-players { font-size: 11px; color: var(--muted); font-family: 'Space Mono', monospace; margin-top: 2px; }
.remove-btn {
  background: none; border: none; cursor: pointer;
  color: var(--muted2); font-size: 16px;
  padding: 4px 8px; border-radius: 6px; line-height: 1;
  transition: all .15s;
}
.remove-btn:hover { color: var(--neon-pink); background: rgba(255,45,120,.1); }
</style>
</head>
<body>
<div class="app">

  <!-- ══ SETUP ══ -->
  <div id="screen-setup" class="screen active">
    <div class="logo-wrap">
      <div class="logo-icon">🎯</div>
      <span class="logo-text">Complicité</span>
    </div>
    <h1><span class="accent-pink">LE JEU</span><br><span class="accent-cyan">COMPLICI</span>TÉ</h1>
    <p style="margin:.75rem 0 2rem">Faites deviner des mots via vos expériences communes.<br>Les autres équipes peuvent <strong style="color:var(--neon-pink)">voler le point</strong>.</p>

    <div class="section-label">// équipes</div>
    <div id="teams-list"></div>

    <div style="display:flex;gap:8px;margin-bottom:.375rem">
      <input type="text" id="inp-team" placeholder="Nom de l'équipe…" aria-label="Nom de l'équipe" />
      <button class="btn btn-add" onclick="addTeam()" aria-label="Ajouter l'équipe">+ Ajouter</button>
    </div>
    <div class="error-msg" id="err-setup" role="alert"></div>
    <div class="divider"></div>
    <button class="btn btn-primary" onclick="startGame()">Lancer la partie →</button>
  </div>

  <!-- ══ PLAYERS ══ -->
  <div id="screen-players" class="screen">
    <div class="logo-wrap"><div class="logo-icon">🎯</div><span class="logo-text">Complicité</span></div>
    <p style="font-size:11px;color:var(--muted2);letter-spacing:.1em;text-transform:uppercase;font-family:'Space Mono',monospace;margin-bottom:.25rem">// configuration équipe</p>
    <h2 id="players-team-name" style="font-size:28px;margin-bottom:1.5rem;color:var(--neon-yellow);text-shadow:0 0 12px rgba(249,224,0,.3)"></h2>
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:.375rem">
      <input type="text" id="inp-p1" placeholder="Prénom joueur 1" aria-label="Prénom joueur 1" />
      <input type="text" id="inp-p2" placeholder="Prénom joueur 2" aria-label="Prénom joueur 2" />
    </div>
    <div class="error-msg" id="err-players" role="alert"></div>
    <div class="divider"></div>
    <button class="btn btn-primary" onclick="savePlayers()">Suivant →</button>
  </div>

  <!-- ══ GAME ══ -->
  <div id="screen-game" class="screen">
    <div class="scores-wrap" id="scores-wrap"></div>
    <div class="turn-pill"><span class="blink"></span><span id="turn-info"></span></div>

    <div class="word-stage" id="word-stage">
      <div class="word-num" id="word-num"></div>
      <div class="word-main" id="word-main" aria-live="polite">—</div>
      <div id="word-cat"></div>
    </div>

    <div id="phase-guess">
      <div class="buzz-label">// qui a deviné ?</div>
      <div class="buzz-grid" id="buzz-grid" role="group" aria-label="Équipes"></div>
      <div class="btn-row" style="margin-top:.75rem">
        <button class="btn btn-ghost" onclick="skipWord()" aria-label="Passer ce mot">⟳ Passer</button>
      </div>
    </div>

    <div id="phase-result" style="display:none">
      <div class="result-card">
        <span class="result-emoji" id="result-emoji"></span>
        <div class="result-msg" id="result-msg"></div>
        <div class="result-word">Mot : <span id="recap-word"></span></div>
      </div>
      <button class="btn btn-primary" onclick="nextTurn()">Tour suivant →</button>
    </div>
  </div>

</div>

let teams=[], scores={}, currentTeamIdx=0, playersSetupIdx=0;

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}
function showErr(id,msg){const e=document.getElementById(id);e.textContent=msg;e.style.display='block';}
function hideErr(id){document.getElementById(id).style.display='none';}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function addTeam(){
  const inp=document.getElementById('inp-team');
  const name=inp.value.trim();
  if(!name)return;
  if(teams.find(t=>t.name.toLowerCase()===name.toLowerCase())){showErr('err-setup','Ce nom existe déjà.');return;}
  hideErr('err-setup');
  teams.push({name,p1:'',p2:''});
  inp.value='';
  renderTeams();
}
function removeTeam(i){teams.splice(i,1);renderTeams();}
function renderTeams(){
  const el=document.getElementById('teams-list');
  if(!teams.length){el.innerHTML='';return;}
  el.innerHTML=teams.map((t,i)=>`
    <div class="team-card">
      <div class="team-num">${String(i+1).padStart(2,'0')}</div>
      <div style="flex:1">
        <div class="team-name">${esc(t.name)}</div>
        ${t.p1?`<div class="team-players">${esc(t.p1)} &amp; ${esc(t.p2)}</div>`:''}
      </div>
      <button class="remove-btn" onclick="removeTeam(${i})" aria-label="Supprimer ${esc(t.name)}">✕</button>
    </div>`).join('');
}

function startGame(){
  if(teams.length<2){showErr('err-setup','Il faut au moins 2 équipes.');return;}
  hideErr('err-setup');
  playersSetupIdx=0;askPlayers(0);
}
function askPlayers(i){
  playersSetupIdx=i;
  document.getElementById('players-team-name').textContent=teams[i].name;
  document.getElementById('inp-p1').value=teams[i].p1||'';
  document.getElementById('inp-p2').value=teams[i].p2||'';
  hideErr('err-players');
  show('screen-players');
  setTimeout(()=>document.getElementById('inp-p1').focus(),100);
}
function savePlayers(){
  const p1=document.getElementById('inp-p1').value.trim();
  const p2=document.getElementById('inp-p2').value.trim();
  if(!p1||!p2){showErr('err-players','Les deux prénoms sont obligatoires.');return;}
  teams[playersSetupIdx].p1=p1;teams[playersSetupIdx].p2=p2;
  if(playersSetupIdx+1<teams.length)askPlayers(playersSetupIdx+1);
  else initGame();
}
function initGame(){
  teams.forEach(t=>scores[t.name]=0);
  currentTeamIdx=0;used.clear();wordCount=0;
  show('screen-game');renderScores();startTurn();
}
function renderScores(){
  document.getElementById('scores-wrap').innerHTML=teams.map((t,i)=>`
    <div class="score-chip ${i===currentTeamIdx?'active':''}" role="status" aria-label="${esc(t.name)}: ${scores[t.name]} points">
      <div class="num">${scores[t.name]}</div>
      <div class="lbl">${esc(t.name)}</div>
    </div>`).join('');
}
function startTurn(){
  const t=teams[currentTeamIdx];
  document.getElementById('turn-info').innerHTML=`<strong>${esc(t.name)}</strong> &mdash; ${esc(t.p1)} fait deviner à ${esc(t.p2)}`;
  document.getElementById('phase-guess').style.display='block';
  document.getElementById('phase-result').style.display='none';
  pickWord();renderBuzz();
}
function pickWord(){
  if(used.size>=WORDS.length)used.clear();
  const pool=WORDS.filter(w=>!used.has(w.m));
  const w=pool[Math.floor(Math.random()*pool.length)];
  currentWord=w;used.add(w.m);wordCount++;
  const wm=document.getElementById('word-main');
  wm.style.animation='none';
  requestAnimationFrame(()=>{
    wm.style.animation='';
    wm.textContent=w.m;
  });
  document.getElementById('word-num').textContent=`// mot n°${wordCount}`;
  document.getElementById('word-cat').innerHTML=`<span class="cat-badge">${esc(w.c)}</span>`;
}
function renderBuzz(){
  document.getElementById('buzz-grid').innerHTML=teams.map((t,i)=>`
    <button class="buzz-btn ${i===currentTeamIdx?'is-active':''}"
      onclick="teamGuessed(${i})"
      aria-label="${esc(t.name)} a deviné">
      <span class="bname">${esc(t.name)}</span>
      <span class="bplayers">${esc(t.p1)} &amp; ${esc(t.p2)}</span>
    </button>`).join('');
}
function teamGuessed(idx){
  const active=teams[currentTeamIdx],guesser=teams[idx];
  let emoji,msg;
  if(idx===currentTeamIdx){
    scores[active.name]++;emoji='🎉';
    msg=`<strong style="color:var(--neon-cyan)">${esc(active.name)}</strong> marque 1 point !`;
  } else {
    scores[guesser.name]++;emoji='⚡';
    msg=`<strong style="color:var(--neon-pink)">${esc(guesser.name)}</strong> vole le point !`;
  }
  document.getElementById('phase-guess').style.display='none';
  document.getElementById('result-emoji').textContent=emoji;
  document.getElementById('result-msg').innerHTML=msg;
  document.getElementById('recap-word').textContent=currentWord.m;
  document.getElementById('phase-result').style.display='block';
  renderScores();
}
function skipWord(){pickWord();}
function nextTurn(){
  currentTeamIdx=(currentTeamIdx+1)%teams.length;
  renderScores();startTurn();
}

document.getElementById('inp-team').addEventListener('keydown',e=>{if(e.key==='Enter')addTeam();});
document.getElementById('inp-p1').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('inp-p2').focus();});
document.getElementById('inp-p2').addEventListener('keydown',e=>{if(e.key==='Enter')savePlayers();});
</script>
</body>
</html>
