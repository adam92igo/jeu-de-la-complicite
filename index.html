<html lang="fr">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complicité</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080810;
  --surface: #13131e;
  --surface2: #1c1c2e;
  --surface3: #242438;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.13);
  --accent: #c8f135;
  --accent-dim: rgba(200,241,53,0.12);
  --accent2: #7c6af7;
  --text: #f0f0ee;
  --muted: rgba(240,240,238,0.4);
  --muted2: rgba(240,240,238,0.22);
  --success: #4ade80;
  --danger: #f87171;
  --r: 14px;
  --r-lg: 20px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);}
body{font-family:'DM Sans',sans-serif;color:var(--text);min-height:100vh;}

/* noise overlay */
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");opacity:.4;pointer-events:none;z-index:0;}

.app{position:relative;z-index:1;width:100%;max-width:580px;margin:0 auto;padding:2rem 1.25rem 5rem;}

/* glow blobs */
.blob{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0;}
.blob-1{width:400px;height:400px;background:rgba(124,106,247,0.08);top:-100px;right:-100px;}
.blob-2{width:300px;height:300px;background:rgba(200,241,53,0.05);bottom:0;left:-80px;}

.screen{display:none;}
.screen.active{display:block;animation:fadeUp .25s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

/* logo */
.logo{display:flex;align-items:center;gap:10px;margin-bottom:2.5rem;}
.logo-icon{width:32px;height:32px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;}
.logo-text{font-family:'Syne',sans-serif;font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}

h1{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(32px,7vw,48px);line-height:1.05;color:var(--text);}
h1 em{font-style:normal;color:var(--accent);}
h2{font-family:'Syne',sans-serif;font-weight:700;font-size:20px;color:var(--text);}
p{font-size:15px;color:var(--muted);line-height:1.65;}

/* inputs */
input[type=text]{
  width:100%;background:var(--surface2);border:1px solid var(--border2);
  border-radius:12px;padding:.8rem 1rem;font-size:15px;
  font-family:'DM Sans',sans-serif;color:var(--text);outline:none;
  transition:border-color .2s,box-shadow .2s;
}
input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(200,241,53,.1);}
input[type=text]::placeholder{color:var(--muted2);}

/* buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:.8rem 1.25rem;border-radius:12px;font-size:15px;
  font-family:'DM Sans',sans-serif;font-weight:500;cursor:pointer;
  border:none;transition:all .15s;
}
.btn-primary{
  background:var(--accent);color:#080810;width:100%;font-weight:700;
  letter-spacing:.01em;
}
.btn-primary:hover{background:#d8ff40;transform:translateY(-1px);box-shadow:0 6px 24px rgba(200,241,53,.18);}
.btn-primary:active{transform:translateY(0);}

.btn-secondary{
  background:var(--surface2);color:var(--text);
  border:1px solid var(--border2);flex:1;
}
.btn-secondary:hover{background:var(--surface3);border-color:rgba(255,255,255,.2);}

.btn-ghost{
  background:transparent;color:var(--muted);
  border:1px solid var(--border);flex:1;
}
.btn-ghost:hover{color:var(--text);border-color:var(--border2);}

.btn-icon{
  background:var(--surface2);border:1px solid var(--border2);
  color:var(--accent);padding:.8rem 1rem;white-space:nowrap;
}
.btn-icon:hover{background:var(--accent-dim);border-color:rgba(200,241,53,.3);}

/* cards */
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:1rem 1.25rem;margin-bottom:.5rem;
}
.section-label{
  font-size:11px;font-weight:500;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted2);margin-bottom:.625rem;
}
.error-msg{font-size:13px;color:var(--danger);margin:.5rem 0;display:none;}
.divider{height:1px;background:var(--border);margin:1.5rem 0;}

/* scores */
.scores-wrap{
  display:flex;gap:6px;margin-bottom:1.25rem;flex-wrap:wrap;
  padding:.75rem;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);
}
.score-chip{
  flex:1;min-width:70px;text-align:center;padding:.5rem .5rem .4rem;
  border-radius:10px;transition:all .2s;
}
.score-chip.active{background:var(--accent-dim);}
.score-chip .num{
  font-family:'Syne',sans-serif;font-weight:800;font-size:24px;
  color:var(--muted);transition:color .2s;
}
.score-chip.active .num{color:var(--accent);}
.score-chip .lbl{
  font-size:11px;color:var(--muted2);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90px;
  margin:0 auto;
}
.score-chip.active .lbl{color:rgba(200,241,53,.5);}

/* turn info */
.turn-pill{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--surface2);border:1px solid var(--border2);
  border-radius:100px;padding:.45rem 1rem;font-size:14px;
  color:var(--muted);margin-bottom:1.25rem;
}
.turn-pill strong{color:var(--accent);font-weight:500;}
.turn-dot{width:7px;height:7px;background:var(--accent);border-radius:50%;animation:pulse 1.5s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.5;transform:scale(.75);}}

/* word stage */
.word-stage{
  background:var(--surface);border:1px solid var(--border);
  border-radius:24px;padding:3rem 1.5rem 2.5rem;
  text-align:center;margin:0 0 1.25rem;
  position:relative;overflow:hidden;
}
.word-stage::after{
  content:'';position:absolute;bottom:-60px;right:-60px;
  width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle,rgba(124,106,247,.08) 0%,transparent 70%);
  pointer-events:none;
}
.word-counter{
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted2);margin-bottom:1.25rem;
}
.word-main{
  font-family:'Syne',sans-serif;font-weight:800;
  font-size:clamp(28px,7vw,46px);color:var(--text);
  line-height:1.1;margin-bottom:.875rem;
  transition:all .2s;
}
.word-cat{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--accent-dim);border:1px solid rgba(200,241,53,.2);
  border-radius:100px;padding:.3rem .875rem;
  font-size:12px;font-weight:500;color:var(--accent);letter-spacing:.04em;
}

/* buzz */
.buzz-section p{font-size:13px;color:var(--muted2);margin-bottom:.625rem;}
.buzz-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:8px;margin-bottom:.75rem;
}
.buzz-btn{
  background:var(--surface2);border:1px solid var(--border2);
  border-radius:14px;padding:.875rem .75rem;cursor:pointer;
  color:var(--text);font-family:'DM Sans',sans-serif;text-align:center;
  transition:all .15s;
}
.buzz-btn:hover{background:var(--surface3);border-color:rgba(255,255,255,.22);transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.3);}
.buzz-btn:active{transform:translateY(0);}
.buzz-btn.is-active{background:var(--accent-dim);border-color:rgba(200,241,53,.35);}
.buzz-btn .bname{font-weight:500;font-size:14px;}
.buzz-btn .bplayers{font-size:12px;color:var(--muted);margin-top:3px;}
.buzz-btn.is-active .bname{color:var(--accent);}
.buzz-btn.is-active .bplayers{color:rgba(200,241,53,.5);}

/* result */
.result-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:2rem 1.5rem;
  text-align:center;margin:.5rem 0 1.25rem;
}
.result-card .emoji{font-size:44px;margin-bottom:.875rem;display:block;}
.result-card .msg{font-size:16px;color:var(--text);line-height:1.5;}
.result-card .word-recap{
  margin-top:.875rem;font-size:13px;color:var(--muted);
}
.result-card .word-recap span{color:var(--text);font-weight:500;}

.btn-row{display:flex;gap:8px;}
</style>
</head>
<body>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<div class="app">
  <div class="logo">
    <div class="logo-icon">🎯</div>
    <span class="logo-text">Complicité</span>
  </div>

  <!-- SETUP -->
  <div id="screen-setup" class="screen active">
    <h1 style="margin-bottom:.75rem">Le jeu de<br>la <em>complicité</em></h1>
    <p style="margin-bottom:2rem">Faites deviner des mots à votre partenaire grâce à vos expériences communes. Les autres équipes peuvent voler le point.</p>
    <div class="section-label">Équipes</div>
    <div id="teams-list"></div>
    <div style="display:flex;gap:8px;margin-bottom:.375rem">
      <input type="text" id="inp-team" placeholder="Nom de l'équipe…" />
      <button class="btn btn-icon" onclick="addTeam()">+ Ajouter</button>
    </div>
    <div class="error-msg" id="err-setup"></div>
    <div class="divider"></div>
    <button class="btn btn-primary" onclick="startGame()">Lancer la partie →</button>
  </div>

  <!-- PLAYERS -->
  <div id="screen-players" class="screen">
    <p style="font-size:13px;color:var(--muted2);margin-bottom:.25rem">Configuration équipe</p>
    <h2 id="players-team-name" style="margin-bottom:1.5rem;font-size:24px"></h2>
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:.375rem">
      <input type="text" id="inp-p1" placeholder="Prénom joueur 1" />
      <input type="text" id="inp-p2" placeholder="Prénom joueur 2" />
    </div>
    <div class="error-msg" id="err-players"></div>
    <div class="divider"></div>
    <button class="btn btn-primary" onclick="savePlayers()">Suivant →</button>
  </div>

  <!-- GAME -->
  <div id="screen-game" class="screen">
    <div class="scores-wrap" id="scores-wrap"></div>
    <div class="turn-pill">
      <span class="turn-dot"></span>
      <span id="turn-info"></span>
    </div>
    <div class="word-stage">
      <div class="word-counter" id="word-counter"></div>
      <div class="word-main" id="word-main">—</div>
      <div id="word-cat"></div>
    </div>

    <div id="phase-guess">
      <div class="buzz-section">
        <p>Qui a deviné le mot ?</p>
        <div class="buzz-grid" id="buzz-grid"></div>
      </div>
      <div class="btn-row">
        <button class="btn btn-ghost" onclick="skipWord()">⟳ Passer ce mot</button>
      </div>
    </div>

    <div id="phase-result" style="display:none">
      <div class="result-card">
        <span class="emoji" id="result-emoji"></span>
        <div class="msg" id="result-msg"></div>
        <div class="word-recap">Mot : <span id="recap-word"></span></div>
      </div>
      <button class="btn btn-primary" onclick="nextTurn()">Tour suivant →</button>
    </div>
  </div>
</div>

let teams=[], scores={}, currentTeamIdx=0, playersSetupIdx=0;
let used=new Set(), currentWord=null, wordCount=0;

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}
function showErr(id,msg){const e=document.getElementById(id);e.textContent=msg;e.style.display='block';}
function hideErr(id){document.getElementById(id).style.display='none';}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function addTeam(){
  const inp=document.getElementById('inp-team');
  const name=inp.value.trim();
  if(!name)return;
  if(teams.find(t=>t.name.toLowerCase()===name.toLowerCase())){showErr('err-setup','Ce nom existe déjà.');return;}
  hideErr('err-setup');
  teams.push({name,p1:'',p2:''});
  inp.value='';
  renderTeams();
}
function removeTeam(i){teams.splice(i,1);renderTeams();}
function renderTeams(){
  const el=document.getElementById('teams-list');
  if(!teams.length){el.innerHTML='';return;}
  el.innerHTML=teams.map((t,i)=>`
    <div class="card" style="display:flex;align-items:center;gap:10px;padding:.75rem 1rem">
      <div style="flex:1">
        <span style="font-weight:500">${esc(t.name)}</span>
        ${t.p1?`<span style="font-size:13px;color:var(--muted);margin-left:8px">${esc(t.p1)} & ${esc(t.p2)}</span>`:''}
      </div>
      <button onclick="removeTeam(${i})" style="background:none;border:none;cursor:pointer;color:var(--muted2);font-size:18px;padding:2px 6px;border-radius:8px;line-height:1">✕</button>
    </div>`).join('');
}

function startGame(){
  if(teams.length<2){showErr('err-setup','Il faut au moins 2 équipes.');return;}
  hideErr('err-setup');
  playersSetupIdx=0;
  askPlayers(0);
}
function askPlayers(i){
  playersSetupIdx=i;
  document.getElementById('players-team-name').textContent=teams[i].name;
  document.getElementById('inp-p1').value=teams[i].p1||'';
  document.getElementById('inp-p2').value=teams[i].p2||'';
  hideErr('err-players');
  show('screen-players');
  setTimeout(()=>document.getElementById('inp-p1').focus(),100);
}
function savePlayers(){
  const p1=document.getElementById('inp-p1').value.trim();
  const p2=document.getElementById('inp-p2').value.trim();
  if(!p1||!p2){showErr('err-players','Les deux prénoms sont obligatoires.');return;}
  teams[playersSetupIdx].p1=p1;teams[playersSetupIdx].p2=p2;
  if(playersSetupIdx+1<teams.length){askPlayers(playersSetupIdx+1);}
  else{initGame();}
}
function initGame(){
  teams.forEach(t=>scores[t.name]=0);
  currentTeamIdx=0;used.clear();wordCount=0;
  show('screen-game');
  renderScores();startTurn();
}
function renderScores(){
  document.getElementById('scores-wrap').innerHTML=teams.map((t,i)=>`
    <div class="score-chip ${i===currentTeamIdx?'active':''}">
      <div class="num">${scores[t.name]}</div>
      <div class="lbl">${esc(t.name)}</div>
    </div>`).join('');
}
function startTurn(){
  const t=teams[currentTeamIdx];
  document.getElementById('turn-info').innerHTML=`<strong>${esc(t.name)}</strong> — ${esc(t.p1)} fait deviner à ${esc(t.p2)}`;
  document.getElementById('phase-guess').style.display='block';
  document.getElementById('phase-result').style.display='none';
  pickWord();renderBuzz();
}
function pickWord(){
  const pool=WORDS.filter(w=>!used.has(w.m));
  if(!pool.length){used.clear();}
  const avail=WORDS.filter(w=>!used.has(w.m));
  const w=avail[Math.floor(Math.random()*avail.length)];
  currentWord=w;used.add(w.m);wordCount++;
  document.getElementById('word-main').textContent=w.m;
  document.getElementById('word-cat').innerHTML=`<span class="word-cat">${w.c}</span>`;
  document.getElementById('word-counter').textContent=`Mot n°${wordCount}`;
}
function renderBuzz(){
  document.getElementById('buzz-grid').innerHTML=teams.map((t,i)=>`
    <button class="buzz-btn ${i===currentTeamIdx?'is-active':''}" onclick="teamGuessed(${i})">
      <div class="bname">${esc(t.name)}</div>
      <div class="bplayers">${esc(t.p1)} & ${esc(t.p2)}</div>
    </button>`).join('');
}
function teamGuessed(idx){
  const active=teams[currentTeamIdx],guesser=teams[idx];
  let emoji,msg;
  if(idx===currentTeamIdx){
    scores[active.name]++;emoji='🎉';
    msg=`<strong>${esc(active.name)}</strong> marque 1 point !`;
  } else {
    scores[guesser.name]++;emoji='⚡';
    msg=`<strong>${esc(guesser.name)}</strong> vole le point !`;
  }
  document.getElementById('phase-guess').style.display='none';
  document.getElementById('result-emoji').textContent=emoji;
  document.getElementById('result-msg').innerHTML=msg;
  document.getElementById('recap-word').textContent=currentWord.m;
  document.getElementById('phase-result').style.display='block';
  renderScores();
}
function skipWord(){pickWord();}
function nextTurn(){
  currentTeamIdx=(currentTeamIdx+1)%teams.length;
  renderScores();startTurn();
}

document.getElementById('inp-team').addEventListener('keydown',e=>{if(e.key==='Enter')addTeam();});
document.getElementById('inp-p1').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('inp-p2').focus();});
document.getElementById('inp-p2').addEventListener('keydown',e=>{if(e.key==='Enter')savePlayers();});
</script>
