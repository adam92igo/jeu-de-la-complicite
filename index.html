<html lang="fr">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jeu de la Complicité</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e0e0f;
  --surface: #1a1a1c;
  --surface2: #242426;
  --border: rgba(255,255,255,0.08);
  --accent: #f0e040;
  --accent2: #ff6b35;
  --text: #f5f5f0;
  --muted: rgba(245,245,240,0.45);
  --success: #4ade80;
  --danger: #f87171;
  --radius: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
}
.app {
  width: 100%;
  max-width: 560px;
  padding: 2rem 1.25rem 4rem;
  min-height: 100vh;
}
.logo {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 13px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 2.5rem;
}
h1 {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: clamp(28px, 6vw, 40px);
  line-height: 1.1;
  margin-bottom: 0.5rem;
}
h2 {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 20px;
  margin-bottom: 1rem;
}
p { font-size: 15px; color: var(--muted); line-height: 1.6; }
.screen { display: none; }
.screen.active { display: block; }

input[type="text"] {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.75rem 1rem;
  font-size: 15px;
  font-family: 'DM Sans', sans-serif;
  color: var(--text);
  outline: none;
  transition: border-color 0.15s;
}
input[type="text"]:focus { border-color: var(--accent); }
input[type="text"]::placeholder { color: var(--muted); }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 0.75rem 1.25rem;
  border-radius: 10px;
  font-size: 15px;
  font-family: 'DM Sans', sans-serif;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  border: none;
}
.btn-primary {
  background: var(--accent);
  color: #0e0e0f;
  width: 100%;
}
.btn-primary:hover { background: #ffe800; transform: translateY(-1px); }
.btn-primary:active { transform: translateY(0); }
.btn-secondary {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  flex: 1;
}
.btn-secondary:hover { background: var(--surface2); }
.btn-ghost {
  background: transparent;
  color: var(--muted);
  border: 1px solid var(--border);
  flex: 1;
}
.btn-ghost:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }

.btn-add {
  background: var(--surface2);
  color: var(--accent);
  border: 1px solid rgba(240,224,64,0.2);
  padding: 0.75rem 1rem;
  white-space: nowrap;
}
.btn-add:hover { background: rgba(240,224,64,0.1); }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1rem 1.25rem;
  margin-bottom: 0.5rem;
}
.error-msg {
  font-size: 13px;
  color: var(--danger);
  margin: 0.5rem 0;
  display: none;
}
.badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 6px;
}
.badge-category {
  background: rgba(240,224,64,0.12);
  color: var(--accent);
  border: 1px solid rgba(240,224,64,0.2);
}

.scores-row {
  display: flex;
  gap: 8px;
  margin-bottom: 1.25rem;
  flex-wrap: wrap;
}
.score-chip {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.5rem 0.875rem;
  text-align: center;
  flex: 1;
  min-width: 80px;
  transition: all 0.2s;
}
.score-chip.active {
  background: rgba(240,224,64,0.1);
  border-color: rgba(240,224,64,0.4);
}
.score-chip .num {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 22px;
  color: var(--text);
}
.score-chip.active .num { color: var(--accent); }
.score-chip .lbl {
  font-size: 11px;
  color: var(--muted);
  margin-top: 1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 90px;
}

.word-stage {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 2.5rem 1.5rem;
  text-align: center;
  margin: 1.25rem 0;
  position: relative;
  overflow: hidden;
}
.word-stage::before {
  content: '';
  position: absolute;
  top: -40px; left: -40px;
  width: 150px; height: 150px;
  background: radial-gradient(circle, rgba(240,224,64,0.06) 0%, transparent 70%);
  pointer-events: none;
}
.word-main {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: clamp(26px, 7vw, 42px);
  color: var(--text);
  margin-bottom: 0.5rem;
  line-height: 1.15;
}
.word-cat { font-size: 13px; color: var(--muted); }

.turn-info {
  font-size: 14px;
  color: var(--muted);
  margin-bottom: 1rem;
  padding: 0.625rem 1rem;
  background: var(--surface);
  border-radius: 10px;
  border: 1px solid var(--border);
}
.turn-info strong { color: var(--accent); font-weight: 500; }

.buzz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 8px;
  margin: 1rem 0;
}
.buzz-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 0.875rem 0.75rem;
  cursor: pointer;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  text-align: center;
  transition: all 0.15s;
}
.buzz-btn:hover { background: var(--surface2); border-color: rgba(255,255,255,0.2); transform: translateY(-1px); }
.buzz-btn.is-active { background: rgba(240,224,64,0.1); border-color: rgba(240,224,64,0.4); }
.buzz-btn .bname { font-weight: 500; font-size: 14px; }
.buzz-btn .bplayers { font-size: 12px; color: var(--muted); margin-top: 2px; }

.result-box {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 1.5rem;
  text-align: center;
  border: 1px solid var(--border);
  margin: 1rem 0;
}
.result-box .big { font-size: 32px; margin-bottom: 0.5rem; }
.result-box p { font-size: 15px; color: var(--text); }

.divider {
  height: 1px;
  background: var(--border);
  margin: 1.25rem 0;
}
.btn-row { display: flex; gap: 8px; }
.section-label {
  font-size: 11px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
  margin-bottom: 0.625rem;
}
</style>
</head>
<body>
<div class="app">
  <div class="logo">🎯 Complicité</div>

  <!-- SETUP -->
  <div id="screen-setup" class="screen active">
    <h1>Le jeu de la<br><span style="color:var(--accent)">complicité</span></h1>
    <p style="margin:0.75rem 0 2rem">Faites deviner des mots à votre partenaire grâce à vos expériences communes.</p>

    <div class="section-label">Équipes</div>
    <div id="teams-list"></div>

    <div style="display:flex;gap:8px;margin-bottom:0.5rem">
      <input type="text" id="inp-team" placeholder="Nom de l'équipe…" />
      <button class="btn btn-add" onclick="addTeam()">+ Ajouter</button>
    </div>
    <div class="error-msg" id="err-setup"></div>

    <div class="divider"></div>
    <button class="btn btn-primary" onclick="startGame()">Lancer la partie →</button>
  </div>

  <!-- PLAYERS -->
  <div id="screen-players" class="screen">
    <p style="margin-bottom:0.375rem;font-size:13px;color:var(--muted)">Équipe</p>
    <h2 id="players-team-name" style="margin-bottom:1.5rem"></h2>
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:0.5rem">
      <input type="text" id="inp-p1" placeholder="Prénom joueur 1" />
      <input type="text" id="inp-p2" placeholder="Prénom joueur 2" />
    </div>
    <div class="error-msg" id="err-players"></div>
    <div class="divider"></div>
    <button class="btn btn-primary" onclick="savePlayers()">Suivant →</button>
  </div>

  <!-- GAME -->
  <div id="screen-game" class="screen">
    <div class="scores-row" id="scores-row"></div>

    <div class="turn-info" id="turn-info"></div>

    <div class="word-stage" id="word-stage">
      <div class="word-main" id="word-main">—</div>
      <div class="word-cat" id="word-cat"></div>
    </div>

    <!-- Phase : deviner -->
    <div id="phase-guess">
      <p style="margin-bottom:0.75rem;font-size:14px">Qui a deviné le mot ?</p>
      <div class="buzz-grid" id="buzz-grid"></div>
      <div class="btn-row">
        <button class="btn btn-ghost" onclick="skipWord()">Passer ce mot</button>
      </div>
    </div>

    <!-- Phase : résultat -->
    <div id="phase-result" style="display:none">
      <div class="result-box">
        <div class="big" id="result-emoji"></div>
        <p id="result-msg"></p>
      </div>
      <button class="btn btn-primary" onclick="nextTurn()">Tour suivant →</button>
    </div>
  </div>
</div>

let teams = [];
let scores = {};
let currentTeamIdx = 0;
let playersSetupIdx = 0;
let usedWords = new Set();
let currentWord = null;

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}
function showErr(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.style.display = 'block';
}
function hideErr(id) {
  document.getElementById(id).style.display = 'none';
}

function addTeam() {
  const inp = document.getElementById('inp-team');
  const name = inp.value.trim();
  if (!name) return;
  if (teams.find(t => t.name.toLowerCase() === name.toLowerCase())) {
    showErr('err-setup', 'Ce nom existe déjà.');
    return;
  }
  hideErr('err-setup');
  teams.push({ name, p1: '', p2: '' });
  inp.value = '';
  renderTeamsList();
}

function removeTeam(i) {
  teams.splice(i, 1);
  renderTeamsList();
}

function renderTeamsList() {
  const el = document.getElementById('teams-list');
  if (!teams.length) { el.innerHTML = ''; return; }
  el.innerHTML = teams.map((t, i) => `
    <div class="card" style="display:flex;align-items:center;gap:10px;padding:0.75rem 1rem">
      <div style="flex:1">
        <span style="font-weight:500">${esc(t.name)}</span>
        ${t.p1 ? `<span style="font-size:13px;color:var(--muted);margin-left:8px">${esc(t.p1)} & ${esc(t.p2)}</span>` : ''}
      </div>
      <button onclick="removeTeam(${i})" style="background:none;border:none;cursor:pointer;color:var(--muted);font-size:18px;padding:2px 6px;border-radius:8px" aria-label="Supprimer">✕</button>
    </div>
  `).join('');
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function startGame() {
  if (teams.length < 2) { showErr('err-setup', 'Il faut au moins 2 équipes.'); return; }
  hideErr('err-setup');
  playersSetupIdx = 0;
  askPlayers(0);
}

function askPlayers(i) {
  playersSetupIdx = i;
  document.getElementById('players-team-name').textContent = teams[i].name;
  document.getElementById('inp-p1').value = teams[i].p1 || '';
  document.getElementById('inp-p2').value = teams[i].p2 || '';
  hideErr('err-players');
  show('screen-players');
  setTimeout(() => document.getElementById('inp-p1').focus(), 100);
}

function savePlayers() {
  const p1 = document.getElementById('inp-p1').value.trim();
  const p2 = document.getElementById('inp-p2').value.trim();
  if (!p1 || !p2) { showErr('err-players', 'Les deux prénoms sont obligatoires.'); return; }
  teams[playersSetupIdx].p1 = p1;
  teams[playersSetupIdx].p2 = p2;
  if (playersSetupIdx + 1 < teams.length) {
    askPlayers(playersSetupIdx + 1);
  } else {
    initGame();
  }
}

function initGame() {
  teams.forEach(t => scores[t.name] = 0);
  currentTeamIdx = 0;
  usedWords.clear();
  show('screen-game');
  renderScores();
  startTurn();
}

function renderScores() {
  const row = document.getElementById('scores-row');
  row.innerHTML = teams.map((t, i) => `
    <div class="score-chip ${i === currentTeamIdx ? 'active' : ''}">
      <div class="num">${scores[t.name]}</div>
      <div class="lbl">${esc(t.name)}</div>
    </div>
  `).join('');
}

function startTurn() {
  const t = teams[currentTeamIdx];
  document.getElementById('turn-info').innerHTML =
    `<strong>${esc(t.name)}</strong> — ${esc(t.p1)} fait deviner à ${esc(t.p2)}`;
  document.getElementById('phase-guess').style.display = 'block';
  document.getElementById('phase-result').style.display = 'none';
  pickWord();
  renderBuzzGrid();
}

function pickWord() {
  const available = WORDS.filter(w => !usedWords.has(w.mot));
  if (!available.length) usedWords.clear();
  const pool = WORDS.filter(w => !usedWords.has(w.mot));
  const w = pool[Math.floor(Math.random() * pool.length)];
  currentWord = w;
  usedWords.add(w.mot);
  document.getElementById('word-main').textContent = w.mot;
  document.getElementById('word-cat').innerHTML = `<span class="badge badge-category">${w.cat}</span>`;
}

function renderBuzzGrid() {
  const grid = document.getElementById('buzz-grid');
  grid.innerHTML = teams.map((t, i) => `
    <button class="buzz-btn ${i === currentTeamIdx ? 'is-active' : ''}" onclick="teamGuessed(${i})">
      <div class="bname">${esc(t.name)}</div>
      <div class="bplayers">${esc(t.p1)} & ${esc(t.p2)}</div>
    </button>
  `).join('');
}

function teamGuessed(idx) {
  const active = teams[currentTeamIdx];
  const guesser = teams[idx];
  let emoji, msg;
  if (idx === currentTeamIdx) {
    scores[active.name]++;
    emoji = '🎉';
    msg = `<strong>${esc(active.name)}</strong> marque 1 point !`;
  } else {
    scores[guesser.name]++;
    emoji = '⚡';
    msg = `<strong>${esc(guesser.name)}</strong> vole le point !`;
  }
  document.getElementById('phase-guess').style.display = 'none';
  document.getElementById('result-emoji').textContent = emoji;
  document.getElementById('result-msg').innerHTML = msg;
  document.getElementById('phase-result').style.display = 'block';
  renderScores();
}

function skipWord() {
  pickWord();
}

function nextTurn() {
  currentTeamIdx = (currentTeamIdx + 1) % teams.length;
  renderScores();
  startTurn();
}

document.getElementById('inp-team').addEventListener('keydown', e => { if (e.key === 'Enter') addTeam(); });
document.getElementById('inp-p1').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('inp-p2').focus(); });
document.getElementById('inp-p2').addEventListener('keydown', e => { if (e.key === 'Enter') savePlayers(); });
</script>
